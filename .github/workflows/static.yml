          <form onsubmit="handleRegistration(event)">
            <div class="form-group">
              <label class="form-label" for="regRole">I am a</label>
              <select class="form-select" id="regRole" onchange="toggleRoleFields()" required>
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="regFullName">Full Name</label>
              <input type="text" class="form-input" id="regFullName" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="regUsername">Username</label>
              <input type="text" class="form-input" id="regUsername" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="regPassword">Password</label>
              <input type="password" class="form-input" id="regPassword" placeholder="Create a password" required>
            </div>

