     </svg><span>Fines</span> </button> <button class="nav-item" data-page="notifications" onclick="loadPage('notifications')">
     <svg class="nav-icon" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
     </svg><span>Notifications</span> <span class="notification-badge hidden" id="notificationBadge">0</span> </button>
   </div><!-- Modal Overlay -->
   <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"><!-- Modal content will be dynamically loaded -->
    </div>
   </div>
