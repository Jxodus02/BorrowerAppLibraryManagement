          <div class="stats-grid" style="grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px;">
            <div class="stat-card">
              <div class="stat-number" style="color: #3b82f6;">${borrowedBooks.length}</div>
              <div class="stat-label">Borrowed Books</div>
