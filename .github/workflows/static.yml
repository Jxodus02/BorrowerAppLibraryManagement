              </svg>
              Create Account
            </button>
          </form>

          <div style="text-align: center; margin-top: 24px;">
            <a class="text-link" onclick="loadPage('login')">Already have an account? Login</a>
          </div>
        </div>
      `;
    }

    function toggleRoleFields() {
      const role = document.getElementById('regRole').value;
      const studentGroup = document.getElementById('studentIdGroup');
      const employeeGroup = document.getElementById('employeeIdGroup');
      const studentInput = document.getElementById('regStudentId');
      const employeeInput = document.getElementById('regEmployeeId');
      
      if (role === 'student') {
        studentGroup.classList.remove('hidden');
        employeeGroup.classList.add('hidden');
        studentInput.required = true;
        employeeInput.required = false;
      } else {
        studentGroup.classList.add('hidden');
        employeeGroup.classList.remove('hidden');
        studentInput.required = false;
        employeeInput.required = true;
      }
    }

    async function handleRegistration(event) {
      event.preventDefault();
      
      const role = document.getElementById('regRole').value;
      const fullName = document.getElementById('regFullName').value;
      const username = document.getElementById('regUsername').value;
      const password = document.getElementById('regPassword').value;
      const email = document.getElementById('regEmail').value;
      const studentId = document.getElementById('regStudentId')?.value;
      const employeeId = document.getElementById('regEmployeeId')?.value;

      if (!fullName || !username || !password || !email) {
        showModal('Error', 'Please fill in all required fields.');
        return;
      }

      // Show loading
      const submitBtn = event.target.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<div class="spinner" style="width: 20px; height: 20px; margin: 0;"></div> Submitting...';
      submitBtn.disabled = true;

      // Simulate API call
      setTimeout(async () => {
        const result = await window.dataSdk.create({
          id: `registration-${Date.now()}`,
          type: 'registration',
          fullName: fullName,
          username: username,
          email: email,
          role: role,
          studentId: studentId || '',
          employeeId: employeeId || '',
          status: 'pending',
          createdAt: new Date().toISOString()
        });

        if (result.isOk) {
          loadPage('pending');
        } else {
          submitBtn.innerHTML = originalText;
          submitBtn.disabled = false;
          showModal('Error', 'Failed to submit registration. Please try again.');
        }
      }, 2000);
    }

    // Pending Approval Page
    function renderPendingPage() {
      return `
        <div class="success-message">
          <svg class="success-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <h2 class="success-title">Registration Submitted!</h2>
          <p class="success-text">Your account is pending approval by the librarian. You will receive an email notification once your account is approved and ready to use.</p>
          <button class="btn btn-primary" onclick="loadPage('login')">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            Back to Login
          </button>
        </div>
      `;
    }

    // Home Page
    function renderHomePage() {
      const borrowedBooks = allRecords.filter(r => r.type === 'borrowed' && r.userId === currentUser?.username);
      const reservations = allRecords.filter(r => r.type === 'reservation' && r.userId === currentUser?.username && r.status === 'pending');
      const userFines = allRecords.filter(r => r.type === 'fine' && r.userId === currentUser?.username && r.status === 'unpaid');
      const pendingFines = userFines;
      const unreadNotifications = sampleNotifications.filter(n => !n.read);
      
      // Get books due soon (within 3 days)
      const booksDueSoon = borrowedBooks.filter(book => {
        const dueDate = new Date(book.dueDate);
        const today = new Date();
        const daysUntilDue = Math.ceil((dueDate - today) / (1000 * 60 * 60 * 24));
        return daysUntilDue <= 3 && daysUntilDue >= 0;
      });

      return `
        <div class="page-header">
          <h1 class="page-title">Welcome back, ${currentUser?.fullName?.split(' ')[0] || 'User'}! 👋</h1>
          <p class="page-subtitle">Here's your library overview</p>
        </div>

