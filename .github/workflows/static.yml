              <div style="display: flex; align-items: center; gap: 16px;">
                <svg style="width: 40px; height: 40px; opacity: 0.9;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <div>
                  <div style="font-size: 16px; font-weight: 600; margin-bottom: 4px;">Special Book Requests</div>
                  <div style="font-size: 13px; opacity: 0.9;">Request books not in our catalog</div>
