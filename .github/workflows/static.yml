              <div style="display: flex; align-items: start; gap: 12px;">
                <svg style="width: 20px; height: 20px; color: #3b82f6; margin-top: 2px; flex-shrink: 0;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <div>
                  <div style="font-size: 14px; font-weight: 600; color: #1e40af; margin-bottom: 4px;">Account Approval Required</div>
                  <div style="font-size: 13px; color: #1e40af; line-height: 1.4;">Your account will be activated once approved by the librarian. You'll receive an email notification when your account is ready.</div>
