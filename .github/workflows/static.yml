              </div>
            </div>
          ` : ''}

          <!-- Books Due Soon Alert -->
          ${booksDueSoon.length > 0 ? `
            <div class="card" style="background: #fef3c7; border-left: 4px solid #f59e0b; margin-bottom: 20px;">
              <div style="display: flex; align-items: start; gap: 12px;">
                <svg style="width: 24px; height: 24px; color: #d97706; margin-top: 2px; flex-shrink: 0;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"/>
                </svg>
                <div>
                  <div style="font-size: 14px; font-weight: 600; color: #92400e; margin-bottom: 4px;">Books Due Soon!</div>
                  <div style="font-size: 13px; color: #92400e; line-height: 1.4;">
                    You have ${booksDueSoon.length} book${booksDueSoon.length > 1 ? 's' : ''} due within 3 days. Consider renewing them to avoid late fees.
                  </div>
                  <button class="btn btn-small" onclick="loadPage('borrowed')" style="background: #d97706; color: white; margin-top: 8px; padding: 6px 12px; font-size: 12px;">
                    View Books
                  </button>
                </div>
              </div>
            </div>
          ` : ''}

          <!-- Recent Activity -->
          ${borrowedBooks.length > 0 ? `
            <div class="card">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <div class="card-title">Recent Activity</div>
                <a class="text-link" onclick="loadPage('borrowed')" style="font-size: 14px;">View All</a>
              </div>
              ${borrowedBooks.slice(0, 3).map(book => {
                const dueDate = new Date(book.dueDate);
                const today = new Date();
                const daysUntilDue = Math.ceil((dueDate - today) / (1000 * 60 * 60 * 24));
                const isOverdue = daysUntilDue < 0;
                const isDueSoon = daysUntilDue <= 3 && daysUntilDue >= 0;

                return `
                  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #f1f5f9;">
                    <div style="width: 40px; height: 40px; background: #f0f9ff; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                      <svg style="width: 20px; height: 20px; color: #3b82f6;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                      </svg>
                    </div>
                    <div style="flex: 1;">
                      <div style="font-weight: 600; color: #111827; margin-bottom: 2px; font-size: 14px;">${book.title}</div>
                      <div style="font-size: 12px; color: #6b7280;">
                        Due: <span class="${isOverdue || isDueSoon ? 'due-soon' : ''}">${dueDate.toLocaleDateString()}</span>
                        ${isOverdue ? ' • Overdue!' : isDueSoon ? ` • ${daysUntilDue} day${daysUntilDue > 1 ? 's' : ''} left` : ''}
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          ` : ''}
        </div>
      `;
    }

    // Catalog Page
    function renderCatalogPage() {
      return `
        <div class="search-container">
          <input type="text" class="search-input" id="catalogSearch" placeholder="Search books, authors..." oninput="filterCatalog()">
        </div>
        <div class="list-container" id="catalogList">
          ${REFERENCE_BOOKS.map(book => `
            <div class="list-item" onclick="showBookDetails('${book.id}')">
              <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
                <div style="flex: 1;">
                  <div class="card-title">${book.title}</div>
                  <div class="card-subtitle">by ${book.author}</div>
                  <div class="card-subtitle">${book.edition}</div>
                </div>
                <span class="badge ${book.available > 0 ? 'badge-success' : 'badge-danger'}">
                  ${book.available > 0 ? `${book.available} Available` : 'Unavailable'}
                </span>
              </div>
              <div class="card-actions">
                ${book.available > 0 ? `
                  <button class="btn btn-primary btn-small" onclick="event.stopPropagation(); borrowBook('${book.id}')">Borrow</button>
                ` : `
                  <button class="btn btn-secondary btn-small" onclick="event.stopPropagation(); reserveBook('${book.id}')">Reserve</button>
                `}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function filterCatalog() {
      const searchTerm = document.getElementById('catalogSearch').value.toLowerCase();
      const filteredBooks = REFERENCE_BOOKS.filter(book => 
        book.title.toLowerCase().includes(searchTerm) ||
        book.author.toLowerCase().includes(searchTerm)
      );

      const catalogList = document.getElementById('catalogList');
      catalogList.innerHTML = filteredBooks.map(book => `
        <div class="list-item" onclick="showBookDetails('${book.id}')">
          <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
            <div style="flex: 1;">
              <div class="card-title">${book.title}</div>
              <div class="card-subtitle">by ${book.author}</div>
              <div class="card-subtitle">${book.edition}</div>
            </div>
            <span class="badge ${book.available > 0 ? 'badge-success' : 'badge-danger'}">
              ${book.available > 0 ? `${book.available} Available` : 'Unavailable'}
            </span>
          </div>
          <div class="card-actions">
            ${book.available > 0 ? `
              <button class="btn btn-primary btn-small" onclick="event.stopPropagation(); borrowBook('${book.id}')">Borrow</button>
            ` : `
              <button class="btn btn-secondary btn-small" onclick="event.stopPropagation(); reserveBook('${book.id}')">Reserve</button>
            `}
          </div>
        </div>
      `).join('');
    }

    function showBookDetails(bookId) {
      const book = REFERENCE_BOOKS.find(b => b.id === bookId);
      if (!book) return;

      showModal(book.title, `
        <div style="margin-bottom: 20px;">
          <div style="font-size: 14px; color: #6b7280; margin-bottom: 4px;">Author</div>
          <div style="font-size: 16px; font-weight: 600; color: #111827; margin-bottom: 16px;">${book.author}</div>
          
          <div style="font-size: 14px; color: #6b7280; margin-bottom: 4px;">Edition</div>
          <div style="font-size: 16px; font-weight: 600; color: #111827; margin-bottom: 16px;">${book.edition}</div>
          
          <div style="font-size: 14px; color: #6b7280; margin-bottom: 4px;">Availability</div>
          <div style="font-size: 16px; font-weight: 600; color: ${book.available > 0 ? '#10b981' : '#ef4444'};">
            ${book.available} of ${book.total} available
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">Close</button>
          ${book.available > 0 ? `
            <button class="btn btn-primary" onclick="borrowBook('${bookId}'); closeModal()">Borrow Book</button>
          ` : `
            <button class="btn btn-primary" onclick="reserveBook('${bookId}'); closeModal()">Reserve Book</button>
          `}
        </div>
      `);
    }

    // Function to create notifications
    function createNotification(type, bookTitle, customMessage = null) {
      const messages = {
        'approval': `📚 '${bookTitle}' has been approved for borrowing.`,
        'borrowed': `📖 You have successfully borrowed '${bookTitle}'.`,
        'reminder': `⚠️ Reminder: '${bookTitle}' is due in 3 days.`,
        'overdue': `🚨 '${bookTitle}' is overdue. Please return immediately.`,
        'renewal_approved': `✅ Your renewal request for '${bookTitle}' was approved.`,
        'renewal_rejected': `❌ Your renewal request for '${bookTitle}' was rejected.`,
        'reservation_confirmed': `📋 Your reservation for '${bookTitle}' has been confirmed.`,
        'available': `✅ Your reservation for '${bookTitle}' is now available for pickup.`,
        'book_request_pending': `📋 Your special request for '${bookTitle}' is pending librarian review.`,
        'book_request_approved': `✅ Your special request for '${bookTitle}' has been approved.`,
        'book_request_rejected': `❌ Your special request for '${bookTitle}' was rejected.`
      };

      const notification = {
        id: `notif-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
        type: type,
        message: customMessage || messages[type] || `Notification about '${bookTitle}'.`,
        bookTitle: bookTitle,
        read: false,
        createdAt: new Date().toISOString()
      };

      sampleNotifications.unshift(notification);
      updateNotificationBadge();
      return notification;
    }

    async function borrowBook(bookId) {
      const book = REFERENCE_BOOKS.find(b => b.id === bookId);
      if (!book) return;

      const dueDate = new Date();
      dueDate.setDate(dueDate.getDate() + 14);
      const borrowId = `borrow-${Date.now()}`;

      const result = await window.dataSdk.create({
        id: borrowId,
        type: 'borrowed',
        userId: currentUser?.username,
        bookId: bookId,
        title: book.title,
        author: book.author,
        dueDate: dueDate.toISOString(),
        status: 'borrowed',
        createdAt: new Date().toISOString()
      });

      if (result.isOk) {
        // Add to history
        await window.dataSdk.create({
          id: `history-${Date.now()}`,
          type: 'history',
          userId: currentUser?.username,
          action: 'borrowed',
          title: book.title,
          author: book.author,
          borrowId: borrowId,
          createdAt: new Date().toISOString()
        });
        
        // Create notification
        createNotification('borrowed', book.title);
        
        showModal('Success! 📚', 'Book borrowed successfully! Check your Borrowed section for details.');
      } else {
        showModal('Error', 'Failed to borrow book. Please try again.');
      }
    }

    async function reserveBook(bookId) {
      const book = REFERENCE_BOOKS.find(b => b.id === bookId);
      if (!book) return;

      const reservationId = `reservation-${Date.now()}`;

      const result = await window.dataSdk.create({
        id: reservationId,
        type: 'reservation',
        userId: currentUser?.username,
        bookId: bookId,
        title: book.title,
        author: book.author,
        status: 'pending',
        createdAt: new Date().toISOString()
      });

      if (result.isOk) {
        // Add to history
        await window.dataSdk.create({
          id: `history-${Date.now()}`,
          type: 'history',
          userId: currentUser?.username,
          action: 'reserved',
          title: book.title,
          author: book.author,
          borrowId: reservationId,
          createdAt: new Date().toISOString()
        });
        
        // Create notification
        createNotification('reservation_confirmed', book.title);
        
        showModal('Success! 📖', 'Book reserved successfully! You will be notified when it becomes available.');
      } else {
        showModal('Error', 'Failed to reserve book. Please try again.');
      }
    }

    // Borrowed Page
    function renderBorrowedPage() {
      const borrowedBooks = allRecords.filter(r => 
        r.type === 'borrowed' && 
        r.userId === currentUser?.username
      );

      if (borrowedBooks.length === 0) {
        return `
          <div class="empty-state">
            <svg class="empty-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
            </svg>
            <div class="empty-title">No borrowed books</div>
            <div class="empty-text">Visit the catalog to borrow your first book!</div>
          </div>
        `;
      }

      return `
        <div class="page-header">
          <h1 class="page-title">Borrowed Books</h1>
          <p class="page-subtitle">${borrowedBooks.length} book${borrowedBooks.length > 1 ? 's' : ''} currently borrowed</p>
        </div>
        <div class="list-container">
          ${borrowedBooks.map(book => {
            const dueDate = new Date(book.dueDate);
            const today = new Date();
            const daysUntilDue = Math.ceil((dueDate - today) / (1000 * 60 * 60 * 24));
            const isOverdue = daysUntilDue < 0;
            const isDueSoon = daysUntilDue <= 3 && daysUntilDue >= 0;

            return `
              <div class="card">
                <div class="card-title">${book.title}</div>
                <div class="card-subtitle">by ${book.author}</div>
                <div style="margin: 12px 0; padding: 12px; background: ${isOverdue ? '#fee2e2' : isDueSoon ? '#fef3c7' : '#f0f9ff'}; border-radius: 8px;">
                  <div style="font-size: 14px; color: #6b7280; margin-bottom: 4px;">Due Date</div>
                  <div class="${isOverdue || isDueSoon ? 'due-soon' : ''}" style="font-weight: 600; font-size: 16px;">
                    ${dueDate.toLocaleDateString()}
                    ${isOverdue ? ' (Overdue!)' : isDueSoon ? ` (${daysUntilDue} day${daysUntilDue > 1 ? 's' : ''} left)` : ''}
                  </div>
                </div>
                <div class="card-actions">
                  <button class="btn btn-primary btn-small" onclick="requestRenewal('${book.id}')">Request Renewal</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    async function requestRenewal(borrowId) {
      const book = allRecords.find(r => r.id === borrowId);
      if (!book) return;

      const renewalId = `renewal-${Date.now()}`;

      const result = await window.dataSdk.create({
        id: renewalId,
        type: 'renewal',
        userId: currentUser?.username,
        bookId: book.bookId,
        borrowId: borrowId,
        title: book.title,
        status: 'pending',
        createdAt: new Date().toISOString()
      });

      if (result.isOk) {
        // Add to history
        await window.dataSdk.create({
          id: `history-${Date.now()}`,
          type: 'history',
          userId: currentUser?.username,
          action: 'renewal_requested',
          title: book.title,
          author: book.author,
          borrowId: renewalId,
          createdAt: new Date().toISOString()
        });
        
        // Create notification for renewal request submitted
        createNotification('renewal_requested', book.title, `🔄 Your renewal request for '${book.title}' has been submitted for review.`);
        
        showModal('Success! 🔄', 'Renewal request submitted! You will be notified once the librarian reviews your request.');
      } else {
        showModal('Error', 'Failed to submit renewal request. Please try again.');
      }
    }

    // Fines Page
    function renderFinesPage() {
      const fines = allRecords.filter(r => 
        r.type === 'fine' && 
        r.userId === currentUser?.username
      );

      const totalUnpaid = fines.filter(f => f.status === 'unpaid').reduce((sum, f) => sum + (f.amount || 0), 0);

      if (fines.length === 0) {
        return `
          <div class="empty-state">
            <svg class="empty-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <div class="empty-title">No fines - Great job! 🎉</div>
            <div class="empty-text">Keep returning books on time to maintain your clean record</div>
          </div>
        `;
      }

      return `
        <div class="page-header">
          <h1 class="page-title">Fines</h1>
          <p class="page-subtitle">Manage your library fines</p>
        </div>

        <div class="list-container">
          <div class="card" style="background: ${totalUnpaid > 0 ? 'linear-gradient(135deg, #ef4444 0%, #dc2626 100%)' : 'linear-gradient(135deg, #10b981 0%, #059669 100())'}; color: white; margin-bottom: 24px;">
            <div style="font-size: 14px; opacity: 0.9; margin-bottom: 8px;">Total Unpaid Fines</div>
            <div style="font-size: 36px; font-weight: 700;">₱${totalUnpaid.toFixed(2)}</div>
          </div>

          ${fines.map(fine => `
            <div class="card">
              <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
                <div style="flex: 1;">
                  <div class="card-title">${fine.title}</div>
                  <div class="card-subtitle">${fine.description || 'Late return fee'}</div>
                  <div style="font-size: 12px; color: #9ca3af; margin-top: 8px;">
                    ${new Date(fine.createdAt).toLocaleDateString()}
                  </div>
                </div>
                <span class="badge ${fine.status === 'paid' ? 'badge-success' : 'badge-danger'}">
                  ${fine.status === 'paid' ? 'Paid' : 'Unpaid'}
                </span>
              </div>
              <div style="font-size: 24px; font-weight: 700; color: ${fine.status === 'paid' ? '#10b981' : '#ef4444'};">
                ₱${(fine.amount || 0).toFixed(2)}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // Notifications Page
    function renderNotificationsPage() {
      const notifications = [...sampleNotifications].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      const unreadCount = notifications.filter(n => !n.read).length;
      const recentNotifications = notifications.filter(n => {
        const notifDate = new Date(n.createdAt);
        const threeDaysAgo = new Date(Date.now() - 3 * 24 * 60 * 60 * 1000);
        return notifDate > threeDaysAgo;
      });
      const olderNotifications = notifications.filter(n => {
        const notifDate = new Date(n.createdAt);
        const threeDaysAgo = new Date(Date.now() - 3 * 24 * 60 * 60 * 1000);
        return notifDate <= threeDaysAgo;
      });

      const getNotificationTypeLabel = (type) => {
        const typeLabels = {
          'approval': 'Book Approved',
          'reminder': 'Due Date Reminder',
          'renewal_approved': 'Renewal Approved',
          'renewal_rejected': 'Renewal Rejected',
          'reservation_cancelled': 'Reservation Cancelled',
          'available': 'Book Available',
          'overdue': 'Overdue Notice',
          'book_request_pending': 'Request Pending',
          'book_request_approved': 'Request Approved',
          'book_request_rejected': 'Request Rejected'
        };
        return typeLabels[type] || 'Notification';
      };

      const getNotificationColor = (type) => {
        const colors = {
          'approval': '#10b981',
          'reminder': '#f59e0b',
          'renewal_approved': '#10b981',
          'renewal_rejected': '#ef4444',
          'reservation_cancelled': '#ef4444',
          'available': '#10b981',
          'overdue': '#ef4444',
          'book_request_pending': '#8b5cf6',
          'book_request_approved': '#10b981',
          'book_request_rejected': '#ef4444'
        };
        return colors[type] || '#6b7280';
      };

      const renderNotificationCard = (notification) => `
        <div class="card" style="background: ${notification.read ? 'white' : '#f8fafc'}; border-left: 4px solid ${notification.read ? '#e5e7eb' : getNotificationColor(notification.type)}; position: relative;">
          <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
            <div style="flex: 1;">
              <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                <span style="background: ${getNotificationColor(notification.type)}; color: white; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; text-transform: uppercase;">
                  ${getNotificationTypeLabel(notification.type)}
                </span>
                ${!notification.read ? '<div class="unread-dot" style="margin-left: 0;"></div>' : ''}
              </div>
              <div class="card-title" style="font-size: 15px; line-height: 1.4; margin-bottom: 8px;">
                ${notification.message}
              </div>
              <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 8px;">
                <div style="display: flex; align-items: center; gap: 6px;">
                  <svg style="width: 14px; height: 14px; color: #6b7280;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                  </svg>
                  <span style="font-size: 13px; color: #6b7280; font-weight: 500;">${notification.bookTitle}</span>
                </div>
              </div>
              <div style="display: flex; align-items: center; gap: 6px;">
                <svg style="width: 14px; height: 14px; color: #9ca3af;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span style="font-size: 12px; color: #9ca3af;">
                  ${new Date(notification.createdAt).toLocaleString()}
                </span>
              </div>
            </div>
            ${!notification.read ? `
              <button class="btn btn-small" onclick="event.stopPropagation(); markAsRead('${notification.id}')" style="background: #3b82f6; color: white; padding: 4px 8px; font-size: 11px; margin-left: 12px;">
                Mark Read
              </button>
            ` : ''}
          </div>
        </div>
      `;

      return `
        <div class="page-header">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
              <h1 class="page-title">Notifications</h1>
              <p class="page-subtitle">${unreadCount} unread • ${notifications.length} total</p>
            </div>
            ${unreadCount > 0 ? `
              <button class="btn btn-secondary btn-small" onclick="markAllAsRead()">Mark All Read</button>
            ` : ''}
          </div>
        </div>

        <div class="list-container">
          ${notifications.length === 0 ? `
            <div class="empty-state">
              <svg class="empty-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
              </svg>
              <div class="empty-title">No notifications</div>
              <div class="empty-text">You're all caught up!</div>
            </div>
          ` : `
            ${recentNotifications.length > 0 ? `
              <div style="margin-bottom: 24px;">
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px; padding: 0 4px;">
                  <svg style="width: 18px; height: 18px; color: #3b82f6;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                  </svg>
                  <h3 style="font-size: 16px; font-weight: 600; color: #111827; margin: 0;">Recent (Last 3 Days)</h3>
                </div>
                ${recentNotifications.map(renderNotificationCard).join('')}
              </div>
            ` : ''}
            
            ${olderNotifications.length > 0 ? `
              <div>
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px; padding: 0 4px;">
                  <svg style="width: 18px; height: 18px; color: #6b7280;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                  </svg>
                  <h3 style="font-size: 16px; font-weight: 600; color: #6b7280; margin: 0;">History</h3>
                </div>
                ${olderNotifications.map(renderNotificationCard).join('')}
              </div>
            ` : ''}
          `}
        </div>
      `;
    }

    function markAsRead(notificationId) {
      const notification = sampleNotifications.find(n => n.id === notificationId);
      if (notification && !notification.read) {
        notification.read = true;
        updateNotificationBadge();
        loadPage('notifications');
      }
    }

    function markAllAsRead() {
      sampleNotifications.forEach(n => n.read = true);
      updateNotificationBadge();
      loadPage('notifications');
    }

    // Book Requests Page (Teachers Only)
    function renderBookRequestsPage() {
      const bookRequests = allRecords.filter(r => 
        r.type === 'book_request' && 
        r.userId === currentUser?.username
      );

      return `
        <div class="page-header">
          <h1 class="page-title">Book Requests</h1>
          <p class="page-subtitle">Request books not available in the catalog</p>
        </div>

        <div class="list-container">
          <div class="card" style="background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; margin-bottom: 24px; cursor: pointer;" onclick="showNewBookRequestForm()">
            <div style="display: flex; align-items: center; gap: 16px;">
              <svg style="width: 48px; height: 48px; opacity: 0.8;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
              <div>
                <div style="font-size: 18px; font-weight: 600; margin-bottom: 4px;">Request New Book</div>
                <div style="font-size: 14px; opacity: 0.8;">Submit a request for books not in our catalog</div>
              </div>
            </div>
          </div>

          ${bookRequests.length === 0 ? `
            <div class="empty-state">
              <svg class="empty-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
              <div class="empty-title">No book requests yet</div>
              <div class="empty-text">Click the button above to request your first book!</div>
            </div>
          ` : bookRequests.map(request => `
            <div class="card">
              <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
                <div style="flex: 1;">
                  <div class="card-title">${request.title}</div>
                  <div class="card-subtitle">by ${request.author}</div>
                  ${request.isbn ? `<div class="card-subtitle">ISBN: ${request.isbn}</div>` : ''}
                  ${request.reason ? `
                    <div style="margin-top: 8px; padding: 8px; background: #f8fafc; border-radius: 6px; font-size: 14px; color: #6b7280;">
                      <strong>Reason:</strong> ${request.reason}
                    </div>
                  ` : ''}
                  <div style="font-size: 12px; color: #9ca3af; margin-top: 8px;">
                    Requested on ${new Date(request.createdAt).toLocaleDateString()}
                  </div>
                </div>
                <span class="badge ${
                  request.status === 'approved' ? 'badge-success' : 
                  request.status === 'rejected' ? 'badge-danger' : 
                  'badge-warning'
                }">
                  ${request.status.charAt(0).toUpperCase() + request.status.slice(1)}
                </span>
              </div>
              ${request.librarian_notes ? `
                <div style="margin-top: 12px; padding: 12px; background: #f0f9ff; border-left: 4px solid #3b82f6; border-radius: 6px;">
                  <div style="font-size: 14px; font-weight: 600; color: #1e40af; margin-bottom: 4px;">Librarian Notes:</div>
                  <div style="font-size: 14px; color: #1e40af;">${request.librarian_notes}</div>
                </div>
              ` : ''}
            </div>
          `).join('')}
        </div>
      `;
    }

    function showNewBookRequestForm() {
      showModal('Request New Book', `
        <div class="form-group">
          <label class="form-label" for="requestTitle">Book Title</label>
          <input type="text" class="form-input" id="requestTitle" placeholder="Enter book title" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="requestAuthor">Author</label>
          <input type="text" class="form-input" id="requestAuthor" placeholder="Enter author name" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="requestISBN">ISBN (Optional)</label>
          <input type="text" class="form-input" id="requestISBN" placeholder="Enter ISBN if known">
        </div>
        <div class="form-group">
          <label class="form-label" for="requestPublisher">Publisher (Optional)</label>
          <input type="text" class="form-input" id="requestPublisher" placeholder="Enter publisher name">
        </div>
        <div class="form-group">
          <label class="form-label" for="requestReason">Reason for Request</label>
          <textarea class="form-input" id="requestReason" placeholder="Why do you need this book? (e.g., for research, course material, etc.)" rows="3" required></textarea>
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="submitBookRequest()">Submit Request</button>
        </div>
      `);
    }

    async function submitBookRequest() {
      const title = document.getElementById('requestTitle').value;
      const author = document.getElementById('requestAuthor').value;
      const isbn = document.getElementById('requestISBN').value;
      const publisher = document.getElementById('requestPublisher').value;
      const reason = document.getElementById('requestReason').value;

      if (!title || !author || !reason) {
        showModal('Error', 'Please fill in all required fields (Title, Author, and Reason).');
        return;
      }

      const result = await window.dataSdk.create({
        id: `book-request-${Date.now()}`,
        type: 'book_request',
        userId: currentUser?.username,
        title: title,
        author: author,
        isbn: isbn || '',
        publisher: publisher || '',
        reason: reason,
        status: 'pending',
        createdAt: new Date().toISOString()
      });

      if (result.isOk) {
        // Add to history
        await window.dataSdk.create({
          id: `history-${Date.now()}`,
          type: 'history',
          userId: currentUser?.username,
          action: 'book_requested',
          title: title,
          author: author,
          createdAt: new Date().toISOString()
        });
        
        // Create notification for book request submitted
        createNotification('book_request_pending', title);
        
        closeModal();
        showModal('Success! 📚', 'Book request submitted successfully! The librarian will review your request and notify you of the decision.');
      } else {
        showModal('Error', 'Failed to submit book request. Please try again.');
      }
    }

    // Side Menu Functions
    function editAccount() {
      closeSideMenu();
      showModal('Edit Account', `
        <div class="form-group">
          <label class="form-label" for="editFullName">Full Name</label>
          <input type="text" class="form-input" id="editFullName" value="${currentUser?.fullName || ''}" placeholder="Enter your full name">
        </div>
        <div class="form-group">
          <label class="form-label" for="editEmail">Email</label>
          <input type="email" class="form-input" id="editEmail" value="${currentUser?.email || ''}" placeholder="Enter your email">
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveAccountChanges()">Save Changes</button>
        </div>
      `);
    }

    function saveAccountChanges() {
      const fullName = document.getElementById('editFullName').value;
      const email = document.getElementById('editEmail').value;
      
      if (fullName && email) {
        currentUser.fullName = fullName;
        currentUser.email = email;
        
        // Update side menu
        document.getElementById('userName').textContent = fullName;
        document.getElementById('userAvatar').textContent = fullName.split(' ').map(n => n[0]).join('');
        
        // Update home page if currently on home
        if (currentPage === 'home') {
          loadPage('home');
        }
        
        closeModal();
        showModal('Success', 'Account updated successfully!');
      }
    }

    function viewHistory() {
      closeSideMenu();
      const activityHistory = allRecords.filter(r => 
        r.type === 'history' && 
        r.userId === currentUser?.username
      ).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      const getActionIcon = (action) => {
        switch(action) {
          case 'borrowed': return '📚';
          case 'reserved': return '📖';
          case 'renewal_requested': return '🔄';
          case 'returned': return '✅';
          default: return '📋';
        }
      };

      const getActionText = (action) => {
        switch(action) {
          case 'borrowed': return 'Borrowed';
          case 'reserved': return 'Reserved';
          case 'renewal_requested': return 'Requested Renewal';
          case 'returned': return 'Returned';
          default: return 'Activity';
        }
      };

      showModal('Activity History', `
        <div style="max-height: 400px; overflow-y: auto;">
          ${activityHistory.length === 0 ? `
            <div style="text-align: center; padding: 40px 20px; color: #6b7280;">
              <p>No activity history yet</p>
              <p style="font-size: 14px; margin-top: 8px;">Start borrowing books to see your activity!</p>
            </div>
          ` : activityHistory.map(record => `
            <div style="padding: 16px 0; border-bottom: 1px solid #f1f5f9; display: flex; align-items: start; gap: 12px;">
              <div style="font-size: 20px;">${getActionIcon(record.action)}</div>
              <div style="flex: 1;">
                <div style="font-weight: 600; color: #111827; margin-bottom: 4px;">${record.title}</div>
                <div style="font-size: 14px; color: #6b7280; margin-bottom: 2px;">
                  ${getActionText(record.action)} • ${record.author || ''}
                </div>
                <div style="font-size: 12px; color: #9ca3af;">
                  ${new Date(record.createdAt).toLocaleString()}
                </div>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="modal-actions">
          <button class="btn btn-primary" onclick="closeModal()">Close</button>
        </div>
      `);
    }

    function logout() {
      closeSideMenu();
      isLoggedIn = false;
      currentUser = null;
      loadPage('login');
    }

    // Forgot Password and OTP functions
    function showForgotPassword() {
      showModal('Reset Password', `
        <div class="form-group">
          <label class="form-label" for="resetEmail">Email Address</label>
          <input type="email" class="form-input" id="resetEmail" placeholder="Enter your email">
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="handlePasswordReset()">Send Reset Link</button>
        </div>
      `);
    }

    function handlePasswordReset() {
      const email = document.getElementById('resetEmail').value;
      if (email) {
        closeModal();
        showModal('Success', 'Password reset link has been sent to your email.');
      }
    }

    function showResendOTP() {
      showModal('Resend OTP', `
        <div class="form-group">
          <label class="form-label" for="otpEmail">Email Address</label>
          <input type="email" class="form-input" id="otpEmail" placeholder="Enter your email">
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="handleResendOTP()">Send OTP</button>
        </div>
      `);
    }

    function handleResendOTP() {
      const email = document.getElementById('otpEmail').value;
      if (email) {
        closeModal();
        showModal('Success', 'OTP has been sent to your email.');
      }
    }

    // Modal Functions
    function showModal(title, content) {
      const modal = document.getElementById('modalContent');
      modal.innerHTML = `
        <div class="modal-title">${title}</div>
        ${content}
      `;
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    // Close modal when clicking overlay
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target.id === 'modalOverlay') {
        closeModal();
      }
    });

    // Special request function for teachers
    async function makeSpecialRequest(borrowId) {
      const book = allRecords.find(r => r.id === borrowId);
      if (!book) return;

      showModal('Special Request', `
        <div class="form-group">
          <label class="form-label" for="requestType">Request Type</label>
          <select class="form-select" id="requestType" required>
            <option value="extended_loan">Extended Loan Period</option>
            <option value="multiple_copies">Multiple Copies</option>
            <option value="priority_renewal">Priority Renewal</option>
            <option value="research_access">Research Access</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="requestReason">Reason</label>
          <textarea class="form-input" id="requestReason" placeholder="Please explain your request..." rows="3" required></textarea>
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="submitSpecialRequest('${borrowId}')">Submit Request</button>
        </div>
      `);
    }

    async function submitSpecialRequest(borrowId) {
      const requestType = document.getElementById('requestType').value;
      const reason = document.getElementById('requestReason').value;
      const book = allRecords.find(r => r.id === borrowId);

      if (!requestType || !reason) {
        showModal('Error', 'Please fill in all fields.');
        return;
      }

      const result = await window.dataSdk.create({
        id: `special-request-${Date.now()}`,
        type: 'special_request',
        userId: currentUser?.username,
        bookId: book?.bookId,
        borrowId: borrowId,
        requestType: requestType,
        reason: reason,
        title: book?.title,
        status: 'pending',
        createdAt: new Date().toISOString()
      });

      if (result.isOk) {
        closeModal();
        showModal('Success! 📋', 'Special request submitted successfully! The librarian will review your request.');
      } else {
        showModal('Error', 'Failed to submit special request. Please try again.');
      }
    }

    // Pay fine function
    async function payFine(fineId) {
      showModal('Pay Fine', `
        <div style="text-align: center; margin-bottom: 20px;">
          <div style="font-size: 18px; font-weight: 600; margin-bottom: 8px;">Confirm Payment</div>
          <div style="font-size: 14px; color: #6b7280;">This will mark the fine as paid</div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button class="btn btn-success" onclick="confirmPayment('${fineId}')">Confirm Payment</button>
        </div>
      `);
    }

    async function confirmPayment(fineId) {
      // For sample fines, just show success message
      const sampleFine = SAMPLE_FINES.find(f => f.id === fineId);
      if (sampleFine) {
        sampleFine.status = 'paid';
        closeModal();
        showModal('Success! 💳', 'Payment processed successfully!');
        loadPage('fines');
        return;
      }

      // For real fines, update in database
      const fine = allRecords.find(r => r.id === fineId);
      if (fine) {
        fine.status = 'paid';
        const result = await window.dataSdk.update(fine);
        
        if (result.isOk) {
          closeModal();
          showModal('Success! 💳', 'Payment processed successfully!');
        } else {
          showModal('Error', 'Payment failed. Please try again.');
        }
      }
    }

    // Initialize app
    initializeApp();
    updateNotificationBadge();
  </script>
