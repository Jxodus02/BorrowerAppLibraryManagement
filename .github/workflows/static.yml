  <script>
    // Reference book data (static)
    const REFERENCE_BOOKS = [
      { id: 'book1', title: 'Introduction to Algorithms', author: 'Thomas H. Cormen', edition: '3rd Edition', available: 5, total: 10 },
      { id: 'book2', title: 'Clean Code', author: 'Robert C. Martin', edition: '1st Edition', available: 0, total: 8 },
      { id: 'book3', title: 'Design Patterns', author: 'Gang of Four', edition: '1st Edition', available: 3, total: 6 },
      { id: 'book4', title: 'The Pragmatic Programmer', author: 'Andrew Hunt', edition: '2nd Edition', available: 7, total: 12 },
      { id: 'book5', title: 'Code Complete', author: 'Steve McConnell', edition: '2nd Edition', available: 0, total: 5 },
      { id: 'book6', title: 'Refactoring', author: 'Martin Fowler', edition: '2nd Edition', available: 4, total: 7 },
      { id: 'book7', title: 'Head First Design Patterns', author: 'Eric Freeman', edition: '1st Edition', available: 6, total: 10 },
      { id: 'book8', title: 'JavaScript: The Good Parts', author: 'Douglas Crockford', edition: '1st Edition', available: 2, total: 8 }
    ];

    // Sample notifications with enhanced formatting
    const SAMPLE_NOTIFICATIONS = [
      { 
        id: 'notif1', 
        type: 'approval',
        message: "📚 'Introduction to Algorithms' has been approved for borrowing.", 
        bookTitle: 'Introduction to Algorithms', 
        read: false, 
        createdAt: new Date(Date.now() - 86400000).toISOString() 
      },
      { 
        id: 'notif2', 
        type: 'reminder',
        message: "⚠️ Reminder: 'Clean Code' is due in 2 days.", 
        bookTitle: 'Clean Code', 
        read: false, 
        createdAt: new Date(Date.now() - 172800000).toISOString() 
      },
      { 
        id: 'notif3', 
        type: 'renewal_approved',
        message: "✅ Your renewal request for 'Design Patterns' was approved.", 
        bookTitle: 'Design Patterns', 
        read: true, 
        createdAt: new Date(Date.now() - 259200000).toISOString() 
      },
      { 
        id: 'notif4', 
        type: 'reservation_cancelled',
        message: "❌ Your reservation for 'The Pragmatic Programmer' was cancelled.", 
        bookTitle: 'The Pragmatic Programmer', 
        read: true, 
        createdAt: new Date(Date.now() - 345600000).toISOString() 
      },
      { 
        id: 'notif5', 
        type: 'available',
        message: "✅ Your reservation for 'Code Complete' is now available for pickup.", 
        bookTitle: 'Code Complete', 
        read: false, 
        createdAt: new Date(Date.now() - 432000000).toISOString() 
      },
      { 
        id: 'notif6', 
        type: 'overdue',
        message: "🚨 'JavaScript: The Good Parts' is overdue. Please return immediately.", 
        bookTitle: 'JavaScript: The Good Parts', 
        read: true, 
        createdAt: new Date(Date.now() - 518400000).toISOString() 
      },
      { 
        id: 'notif7', 
        type: 'book_request_pending',
        message: "📋 Your special request for 'AI for Educators' is pending librarian review.", 
        bookTitle: 'AI for Educators', 
        read: false, 
        createdAt: new Date(Date.now() - 604800000).toISOString() 
      },
      { 
        id: 'notif8', 
        type: 'renewal_rejected',
        message: "❌ Your renewal request for 'Operating System Concepts' was rejected.", 
        bookTitle: 'Operating System Concepts', 
        read: true, 
        createdAt: new Date(Date.now() - 691200000).toISOString() 
      }
    ];

    // App state
    let currentPage = 'login';
    let currentUser = null;
    let isLoggedIn = false;
    let allRecords = [];
    let sampleNotifications = [...SAMPLE_NOTIFICATIONS];

    // Default config
    const defaultConfig = {
      app_title: 'Library Borrower',
      welcome_message: 'Welcome to your library'
    };

    // Initialize Element SDK
    const elementApi = {
      defaultConfig: defaultConfig,
      onConfigChange: async (config) => {
        const title = config.app_title || defaultConfig.app_title;
        const welcome = config.welcome_message || defaultConfig.welcome_message;
        
        document.getElementById('headerTitle').textContent = title;
        
        const welcomeElement = document.getElementById('welcomeMessage');
        if (welcomeElement) {
          welcomeElement.textContent = welcome;
        }
      },
      mapToCapabilities: (config) => ({
        recolorables: [],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined
      }),
      mapToEditPanelValues: (config) => new Map([
        ['app_title', config.app_title || defaultConfig.app_title],
        ['welcome_message', config.welcome_message || defaultConfig.welcome_message]
      ])
    };

    // Initialize Data SDK
    const dataHandler = {
      onDataChanged(data) {
        allRecords = data;
        updateNotificationBadge();
        if (isLoggedIn && (currentPage === 'borrowed' || currentPage === 'fines' || currentPage === 'notifications' || currentPage === 'home')) {
          loadPage(currentPage);
        }
      }
    };

    // Initialize SDKs
    async function initializeApp() {
      if (window.elementSdk) {
        window.elementSdk.init(elementApi);
      }
      
      if (window.dataSdk) {
        const result = await window.dataSdk.init(dataHandler);
        if (!result.isOk) {
          console.error('Failed to initialize data SDK');
        }
      }
      
      loadPage('login');
    }

    // Update notification badge
    function updateNotificationBadge() {
      const unreadNotifications = sampleNotifications.filter(n => !n.read);
      const badge = document.getElementById('notificationBadge');
      if (unreadNotifications.length > 0) {
        badge.textContent = unreadNotifications.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    // Navigation
    function loadPage(page) {
      currentPage = page;
      
      // Update nav items
      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('active');
        if (item.dataset.page === page) {
          item.classList.add('active');
        }
      });

      const contentArea = document.getElementById('contentArea');
      const bottomNav = document.getElementById('bottomNav');
      
      // Show/hide bottom nav and menu button based on login status and page
      const menuButton = document.getElementById('menuButton');
      const requestsNavItem = document.getElementById('requestsNavItem');
      
      if (!isLoggedIn || page === 'login' || page === 'register' || page === 'pending') {
        bottomNav.classList.remove('show');
        contentArea.classList.remove('with-nav');
        menuButton.classList.add('hidden');
      } else {
        bottomNav.classList.add('show');
        contentArea.classList.add('with-nav');
        menuButton.classList.remove('hidden');
        
        // Show/hide requests tab based on user role
        if (currentUser?.role === 'teacher') {
          requestsNavItem.style.display = 'flex';
        } else {
          requestsNavItem.style.display = 'none';
        }
      }

      // Load page content
      switch(page) {
        case 'login':
          contentArea.innerHTML = renderLoginPage();
          break;
        case 'register':
          contentArea.innerHTML = renderRegisterPage();
          break;
        case 'pending':
          contentArea.innerHTML = renderPendingPage();
          break;
        case 'home':
          contentArea.innerHTML = renderHomePage();
          break;
        case 'catalog':
          contentArea.innerHTML = renderCatalogPage();
          break;
        case 'borrowed':
          contentArea.innerHTML = renderBorrowedPage();
          break;
        case 'fines':
          contentArea.innerHTML = renderFinesPage();
          break;
        case 'notifications':
          contentArea.innerHTML = renderNotificationsPage();
          break;
        case 'requests':
          contentArea.innerHTML = renderBookRequestsPage();
          break;
      }

      closeSideMenu();
    }

    // Side Menu Functions
    function toggleSideMenu() {
      const overlay = document.getElementById('sideMenuOverlay');
      const menu = document.getElementById('sideMenu');
      
      overlay.classList.toggle('active');
      menu.classList.toggle('active');
    }

    function closeSideMenu() {
      const overlay = document.getElementById('sideMenuOverlay');
      const menu = document.getElementById('sideMenu');
      
      overlay.classList.remove('active');
      menu.classList.remove('active');
    }

    // Login Page
    function renderLoginPage() {
      return `
        <div class="auth-container">
          <div class="auth-logo">
            <svg class="auth-logo-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
            </svg>
            <h1 class="auth-title" id="welcomeMessage">${window.elementSdk?.config?.welcome_message || defaultConfig.welcome_message}</h1>
            <p class="auth-subtitle">Sign in to access your library account</p>
          </div>
          
          <form onsubmit="handleLogin(event)">
            <div class="form-group">
              <label class="form-label" for="loginRole">I am a</label>
              <select class="form-select" id="loginRole" required>
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="loginUsername">Username</label>
              <input type="text" class="form-input" id="loginUsername" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="loginPassword">Password</label>
              <input type="password" class="form-input" id="loginPassword" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary">
              <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
              </svg>
              Login
            </button>
          </form>
          
          <div class="auth-links">
            <a class="text-link" onclick="showForgotPassword()">Forgot Password?</a>
            <a class="text-link" onclick="showResendOTP()">Resend OTP</a>
          </div>

          <div class="divider"></div>

          <button class="btn btn-secondary" onclick="loadPage('register')">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
            </svg>
            Create New Account
          </button>
        </div>
      `;
    }

    function handleLogin(event) {
      event.preventDefault();
      
      const role = document.getElementById('loginRole').value;
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;

      if (!role || !username || !password) {
        showModal('Error', 'Please fill in all fields.');
        return;
      }

      // Simulate login
      isLoggedIn = true;
      currentUser = { 
        username: username, 
        role: role, 
        fullName: role === 'teacher' ? 'Dr. Sarah Johnson' : 'John Doe',
        email: role === 'teacher' ? 'sarah.johnson@school.edu' : 'john.doe@student.edu'
      };
      
      // Update side menu
      document.getElementById('userName').textContent = currentUser.fullName;
      document.getElementById('userRole').textContent = currentUser.role.charAt(0).toUpperCase() + currentUser.role.slice(1);
      document.getElementById('userAvatar').textContent = currentUser.fullName.split(' ').map(n => n[0]).join('');
      
      loadPage('home');
    }

    // Register Page
    function renderRegisterPage() {
      return `
        <div class="auth-container">
          <div class="auth-logo">
            <svg class="auth-logo-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
