            <div class="stat-card">
              <div class="stat-number" style="color: ${booksDueSoon.length > 0 ? '#f59e0b' : '#10b981'};">${booksDueSoon.length}</div>
              <div class="stat-label">Due Soon</div>
            </div>
            <div class="stat-card">
              <div class="stat-number" style="color: ${reservations.length > 0 ? '#8b5cf6' : '#6b7280'};">${reservations.length}</div>
              <div class="stat-label">Reservations</div>
            </div>
            <div class="stat-card">
              <div class="stat-number" style="color: ${pendingFines.length > 0 ? '#ef4444' : '#10b981'};">₱${pendingFines.reduce((sum, f) => sum + (f.amount || 0), 0).toFixed(2)}</div>
              <div class="stat-label">Unpaid Fines</div>
            </div>
          </div>

          <!-- Quick Navigation Cards -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px;">
            <div class="card" onclick="loadPage('catalog')" style="cursor: pointer; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; padding: 16px;">
              <div style="text-align: center;">
                <svg style="width: 32px; height: 32px; margin: 0 auto 8px; opacity: 0.9;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                </svg>
                <div style="font-size: 14px; font-weight: 600;">Browse Catalog</div>
              </div>
            </div>

            <div class="card" onclick="loadPage('borrowed')" style="cursor: pointer; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; padding: 16px;">
              <div style="text-align: center;">
                <svg style="width: 32px; height: 32px; margin: 0 auto 8px; opacity: 0.9;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
                <div style="font-size: 14px; font-weight: 600;">My Books</div>
              </div>
            </div>

            <div class="card" onclick="loadPage('fines')" style="cursor: pointer; background: linear-gradient(135deg, ${pendingFines.length > 0 ? '#ef4444' : '#6b7280'} 0%, ${pendingFines.length > 0 ? '#dc2626' : '#4b5563'} 100%); color: white; padding: 16px;">
              <div style="text-align: center;">
                <svg style="width: 32px; height: 32px; margin: 0 auto 8px; opacity: 0.9;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
